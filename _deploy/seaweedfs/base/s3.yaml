apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
  labels:
    app: seaweedfs-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-s3
  template:
    metadata:
      labels:
        app: seaweedfs-s3
    spec:
      containers:
      - name: seaweedfs-s3
        image: docker.io/chrislusf/seaweedfs
        ports:
          - containerPort: 8333
          - containerPort: 18333
          - containerPort: 9327
        args:
          - s3 
          - -ip.bind=0.0.0.0
          - -metricsPort=9327
          - -filer=seaweedfs-filer:8888
          - -config=/config/s3.json
        volumeMounts:
          - name: s3
            mountPath: "/config/"
            readOnly: true
      volumes:
        - name: s3
          projected:
            sources:
              - secret:
                  name: s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
spec:
  clusterIP: None
  selector:
    app: seaweedfs-s3
  ports:
  - port: 8333
    name: s3
  - port: 18333
    name: s3-grpc
  - port: 9327
    name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3-nodeport
spec:
  type: NodePort
  selector:
    app: seaweedfs-s3
  ports:
  - port: 8333