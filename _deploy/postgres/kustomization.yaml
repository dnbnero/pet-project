apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres

images:
  - name: docker.io/postgres
    newName: docker.io/postgres
    newTag: '16'

resources:
  - ./base/statefulset.yaml
  - ./base/deployment.yaml
  - ./base/namespace.yaml
  - ./base/service.yaml

secretGenerator:
- name: pg-pass
  envs:
    - ./configs/.env
      
labels:
  - pairs:
      managed-by-kustomize: "true"