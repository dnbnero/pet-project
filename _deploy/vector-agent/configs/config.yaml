data_dir: /vector-data-dir
api:
  enabled: true
  address: 127.0.0.1:8686
  playground: false

sources:
  kubernetes_logs:
    type: kubernetes_logs
  internal_metrics:
    type: internal_metrics
    scrape_interval_secs: 15
    
transforms:
  kubernetes_logs_transform:
    type: remap
    inputs: [kubernetes_logs]
    source: |-
      del(.file)
  internal_metrics_transform:
    type: remap
    inputs: [internal_metrics]
    source: |-
      .tags.job = "vector_internal_metrics"
      host, err = get_env_var("VECTOR_SELF_NODE_NAME")
      .tags.host = host

sinks:
  vlogs:
    inputs:
      - kubernetes_logs_transform
    type: elasticsearch
    endpoints:
      - http://victorialogs-0.vl.victoria.svc.cluster.local:9428/insert/elasticsearch/
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: kubernetes.pod_node_name,kubernetes.container_name
  victoriametrics_sink:
    type: prometheus_remote_write
    inputs:
      - internal_metrics_transform
    endpoint: "http://victoriametrics-0.vm.victoria.svc.cluster.local:8428/api/v1/write"
    healthcheck:
      enabled: false