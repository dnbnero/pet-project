apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vector

images:
  - name: docker.io/timberio/vector
    newName: docker.io/timberio/vector
    newTag: 0.46.1-distroless-libc

resources:
  - ./base/namespace.yaml
  - ./base/daemonset.yaml
  - ./base/rbac.yaml
  - ./base/serviceaccount.yaml

configMapGenerator:
  - name: vector
    files:
      - ./configs/config.yaml

labels:
  - pairs:
      managed-by-kustomize: "true"